schema_version: "1.1"
name: audit-pr-unreachable
description: >
  PR mode fetches the diff with `gh pr diff`. Eval runs have no gh login, no network and no
  GitHub remote, so the fetch fails: the audit stops with a message naming the PR, before any
  classification, and does not fall back to a local diff. The success path (PR diff audited
  like a ref diff) is not covered here. Needs --scaffold and --allow-tools Bash.
tags: [audit, diff, pr]
context:
  scaffold_script: scaffold.sh
