schema_version: "1.1"
name: audit-confirm
description: >
  Resumes a default audit that ended at its report and offer (history.jsonl, made by
  record-history.sh), and answers "yes". The trivial fixes are applied and listed under Applied;
  local refactors, tickets and ADRs stay in the report, unapplied. Run it with
  --allow-tools Edit Write Bash (WSL2 or Linux).
tags: [audit, fix]
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
